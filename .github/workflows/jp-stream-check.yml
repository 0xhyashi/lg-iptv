name: Test public Japanese IPTV stream reachability
on:
  push:
    branches: [privacy/toonami-single-stream-test]
    paths: [.github/workflows/jp-stream-check.yml]
  workflow_dispatch:
jobs:
  check-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Japanese playlist endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.error, re, ssl, json
          sources = {
            "MrKagesan JP-IPTV": "https://raw.githubusercontent.com/MrKagesan/JP-IPTV/main/JP.m3u",
            "Free-TV Japan": "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_japan.m3u8",
            "iptv-org Japan": "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/jp.m3u",
            "iptv-org Japanese language": "https://iptv-org.github.io/iptv/languages/jpn.m3u",
          }
          def fetch(url, timeout=9):
            req=urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 LG-IPTV stream checker","Accept":"*/*"})
            with urllib.request.urlopen(req, timeout=timeout) as r:
              data=r.read(140000)
              return r.status, r.url, data
          entries=[]
          for source,url in sources.items():
            try:
              status,final,blob=fetch(url,15)
              text=blob.decode("utf-8","replace")
              info=None
              for line in text.splitlines():
                line=line.strip()
                if line.startswith("#EXTINF"):
                  info=line.rsplit(",",1)[-1].strip()
                elif line.startswith(("https://","http://")) and info:
                  entries.append((source,info,line))
                  info=None
              print("PLAYLIST",source,"entries",sum(1 for x in entries if x[0]==source),flush=True)
            except Exception as e:
              print("PLAYLIST_ERROR",source,str(e)[:110],flush=True)
          unique={}
          for source,name,url in entries:
            if url not in unique:unique[url]=(source,name,url)
          def probe(item):
            source,name,url=item
            try:
              status,final,data=fetch(url,8)
              content=data[:2000].decode("utf-8","replace")
              is_hls = "#EXTM3U" in content
              if is_hls: return ("OK", source, name, url, str(status))
              return ("NOT_HLS",source,name,url,str(status))
            except urllib.error.HTTPError as e:
              return ("HTTP_"+str(e.code),source,name,url,str(e.code))
            except Exception as e:
              return ("ERROR",source,name,url,str(e)[:50])
          with concurrent.futures.ThreadPoolExecutor(max_workers=18) as pool:
            results=list(pool.map(probe,unique.values()))
          good=[r for r in results if r[0]=="OK"]
          from collections import Counter
          print("SUMMARY",json.dumps({"entries":len(entries),"unique":len(unique),"valid_hls":len(good),"outcomes":dict(Counter(x[0] for x in results))}),flush=True)
          for rec in good:
            print("PLAYABLE",json.dumps({"source":rec[1],"name":rec[2],"url":rec[3]},ensure_ascii=False),flush=True)
          PY
