name: Build-check radio playback
on:
  push:
    branches: [privacy/toonami-single-stream-test]
    paths:
      - .github/workflows/radio-build-check.yml
      - js/app.js
      - js/livetv/pip.js
      - pages/livetv.html
      - assets/player.css
      - appinfo.json
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compile source for webOS
        run: |
          npm ci --no-audit
          npm run build
      - name: Validate radio channels, audio markup and styles
        run: |
          node --check dist/js/app.js
          node --check dist/js/livetv/pip.js
          node - <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('dist/js/app.js','utf8');
          const html = fs.readFileSync('pages/livetv.html','utf8');
          const css = fs.readFileSync('dist/css/player.css','utf8');
          const info = JSON.parse(fs.readFileSync('appinfo.json','utf8'));
          for (const str of [
            'https://wtmd-ice.streamguys1.com/wtmd.mp3',
            'https://wtmd-ice.streamguys1.com/hd2.mp3',
            'https://shonanbeachfm.out.airtime.pro/shonanbeachfm_c',
            'radioChannels, japanese',
            '/est/playlist.m3u8',
            '/pst/playlist.m3u8',
            '/movies/playlist.m3u8',
            '/radio/playlist.m3u8',
            '/countries/jp.m3u'
          ]) if (!js.includes(str)) throw new Error('Missing source: ' + str);
          if (!html.includes('id="radio-audio"') || !html.includes('id="radio-visual"')) throw new Error('Missing audio UI');
          if (!css.includes('#radio-visual')) throw new Error('Missing compiled CSS');
          if (info.version !== '1.0.36') throw new Error('Wrong version: '+info.version);
          console.log('Radio build check passed: v'+info.version);
          NODE
