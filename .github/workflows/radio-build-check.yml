name: Build-check radio playback
on:
  push:
    branches: [privacy/toonami-single-stream-test]
    paths:
      - .github/workflows/radio-build-check.yml
      - js/app.js
      - js/livetv/pip.js
      - pages/livetv.html
      - assets/player.css
      - assets/radio.css
      - js/livetv/radio.js
      - js/dpad.js
      - appinfo.json
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compile source for webOS
        run: |
          npm ci --no-audit
          npm run build
      - name: Validate radio channels, audio markup and styles
        run: |
          node --check dist/js/app.js
          node --check dist/js/livetv/pip.js
          node --check dist/js/livetv/radio.js
          node --check dist/js/dpad.js
          node - <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('dist/js/app.js','utf8');
          const html = fs.readFileSync('pages/livetv.html','utf8');
          const css = fs.readFileSync('dist/css/player.css','utf8');
          const radioCSS = fs.readFileSync('dist/css/radio.css','utf8');
          const deck = fs.readFileSync('dist/js/livetv/radio.js','utf8');
          const remote = fs.readFileSync('dist/js/dpad.js','utf8');
          const info = JSON.parse(fs.readFileSync('appinfo.json','utf8'));
          for (const str of [
            'https://wtmd-ice.streamguys1.com/wtmd.mp3',
            'https://wtmd-ice.streamguys1.com/hd2.mp3',
            'https://shonanbeachfm.out.airtime.pro/shonanbeachfm_c',
            'https://live.amperwave.net/direct/audacy-wezbfmmp3-imc',
            'https://playerservices.streamtheworld.com/api/livestream-redirect/WZRHFM.mp3',
            'https://live.amperwave.net/direct/audacy-wlmgfmmp3-imc',
            'https://stream.revma.ihrhls.com/zc1005',
            'https://stream.revma.ihrhls.com/zc1045',
            'radioChannels, japanese',
            '/est/playlist.m3u8',
            '/pst/playlist.m3u8',
            '/movies/playlist.m3u8',
            '/radio/playlist.m3u8',
            '/countries/jp.m3u'
          ]) if (!js.includes(str)) throw new Error('Missing source: ' + str);
          if (!html.includes('id="radio-audio"') || !html.includes('id="radio-visual"')) throw new Error('Missing audio UI');
          for (const id of ['radio-headspace-svg','radio-scope-canvas','radio-frequency','radio-track','radio-artist','radio-cover','radio-toggle']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing deck UI: ' + id);
          }
          if (!html.includes('liv etv/radio.js'.replace(' ', '')) || !html.includes('radio.css')) throw new Error('Headspace module not linked');
          if (!radioCSS.includes('.mode-headspace') || !radioCSS.includes('.mode-scope') || !radioCSS.includes('.mode-tuner')) throw new Error('Missing visualizer CSS');
          if (!deck.includes('itunes.apple.com/search') || !deck.includes('trackHistory') || !deck.includes('WZRHFM') || !deck.includes('radio-head-trace')) throw new Error('Missing metadata/art/oscilloscope engine');
          if (!remote.includes('RadioDeck.cycleMode')) throw new Error('Missing remote shortcut');
          if ((js.match(/stream_id: "radio-/g) || []).length !== 8) throw new Error('Expected eight radio streams');

          if (!css.includes('#radio-visual')) throw new Error('Missing compiled CSS');
          if (info.version !== '1.0.39') throw new Error('Wrong version: '+info.version);
          console.log('Radio build check passed: v'+info.version);
          NODE
