name: Probe radio metadata APIs and browser CORS
on:
  push:
    branches: [privacy/toonami-single-stream-test]
    paths: [.github/workflows/radio-metadata-probe.yml]
  workflow_dispatch:
jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query sources with browser-origin headers
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,concurrent.futures
          endpoints=[
            ("wtmd_status","https://wtmd-ice.streamguys1.com/status-json.xsl",False),
            ("wtmd_stream","https://wtmd-ice.streamguys1.com/wtmd.mp3",True),
            ("wtmd_hd2_stream","https://wtmd-ice.streamguys1.com/hd2.mp3",True),
            ("shonan_status","https://shonanbeachfm.out.airtime.pro/status-json.xsl",False),
            ("shonan_airtime","https://shonanbeachfm.airtime.pro/api/live-info",False),
            ("shonan_stream","https://shonanbeachfm.out.airtime.pro/shonanbeachfm_c",True),
            ("b97_stream","https://live.amperwave.net/direct/audacy-wezbfmmp3-imc",True),
            ("magic_stream","https://live.amperwave.net/direct/audacy-wlmgfmmp3-imc",True),
            ("alt_stream","https://playerservices.streamtheworld.com/api/livestream-redirect/WZRHFM.mp3",True),
            ("wfmf_stream","https://stream.revma.ihrhls.com/zc1005",True),
            ("wfmf_current","https://us.api.iheart.com/api/v3/live-meta/stream/1005/currentTrackMeta",False),
            ("wfmf_recent","https://us.api.iheart.com/api/v3/live-meta/stream/1005/tracks",False),
            ("alt_triton","https://np.tritondigital.com/public/nowplaying?mountName=WZRHFM&numberToFetch=1&eventType=track",False),
            ("alt_triton_aac","https://np.tritondigital.com/public/nowplaying?mountName=WZRHFMAAC&numberToFetch=1&eventType=track",False),
            ("itunes","https://itunes.apple.com/search?term=Talking%20Heads%20Psycho%20Killer&entity=song&limit=1",False),
            ("itunes_jsonp","https://itunes.apple.com/search?term=Talking%20Heads%20Psycho%20Killer&entity=song&limit=1&callback=metadataCB",False),
            ("wfmf_track_history","https://api.iheart.com/api/v3/live-meta/stream/1005/trackHistory",False),
            ("wfmf_us_track_history","https://us.api.iheart.com/api/v3/live-meta/stream/1005/trackHistory",False),
            ("wnoe_track_history","https://api.iheart.com/api/v3/live-meta/stream/1045/trackHistory",False),
            ("wnoe_us_track_history","https://us.api.iheart.com/api/v3/live-meta/stream/1045/trackHistory",False)
          ]
          def probe(item):
            label,url,stream=item
            headers={"User-Agent":"Mozilla/5.0", "Origin":"null"}
            if stream:headers["Icy-MetaData"]="1"
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=9) as r:
                chunk=r.read(100000 if stream else 1600)
                metaint=r.headers.get("icy-metaint")
                meta=""
                if metaint:
                  i=int(metaint)
                  if len(chunk)>i:
                    n=chunk[i]*16
                    meta=repr(chunk[i+1:i+1+n])[:260]
                return dict(name=label,status=r.status,mime=r.headers.get("content-type"),cors=r.headers.get("access-control-allow-origin"),icymeta=metaint,icytitle=r.headers.get("icy-name"),meta=meta,preview=("" if stream else chunk[:400].decode("utf8","replace")),body_bytes=len(chunk))
            except Exception as e:return dict(name=label,error=str(e)[:200])
          def preflight(item):
            name,url,stream=item
            if not stream:return
            req=urllib.request.Request(url,method="OPTIONS",headers={"Origin":"null","Access-Control-Request-Method":"GET","Access-Control-Request-Headers":"icy-metadata","User-Agent":"Mozilla/5.0"})
            try:
              with urllib.request.urlopen(req,timeout=7) as r:
                return dict(name=name,status=r.status,cors=r.headers.get("Access-Control-Allow-Origin"),headers=r.headers.get("Access-Control-Allow-Headers"),methods=r.headers.get("Access-Control-Allow-Methods"))
            except urllib.error.HTTPError as e:
              return dict(name=name,status=e.code,cors=e.headers.get("Access-Control-Allow-Origin"),headers=e.headers.get("Access-Control-Allow-Headers"),methods=e.headers.get("Access-Control-Allow-Methods"))
            except Exception as e:return dict(name=name,error=str(e)[:180])
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
            for r in pool.map(preflight,endpoints):
              if r:print("PREFLIGHT_PROBE",json.dumps(r,ensure_ascii=False),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
            for r in pool.map(probe,endpoints):print("METADATA_PROBE",json.dumps(r,ensure_ascii=False),flush=True)
          PY