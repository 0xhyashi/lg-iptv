name: Probe WeatherStar internet-radio audio
on:
  push:
    branches: [privacy/toonami-single-stream-test]
    paths: [.github/workflows/weather-audio-probe.yml]
  workflow_dispatch:
jobs:
  streams:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate direct MP3 streams from official providers
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          urls=[
            ("nightwave-mp3","https://radio.plaza.one/mp3"),
            ("nightwave-96","https://radio.plaza.one/mp3_96"),
            ("somafm-vaporwaves","https://ice5.somafm.com/vaporwaves-128-mp3"),
          ]
          for label,url in urls:
            result={"name":label,"url":url}
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"BunkhouseTV/1.0 (personal listening)","Icy-MetaData":"1"})
              with urllib.request.urlopen(req,timeout=12) as resp:
                chunk=resp.read(16384)
                result.update({"status":resp.status,"type":resp.headers.get("content-type"),"final":resp.url,"cors":resp.headers.get("access-control-allow-origin"),"icy":resp.headers.get("icy-metaint"),"bytes":len(chunk),"header":chunk[:12].hex()})
                assert resp.status==200 and len(chunk)>4096
                assert resp.headers.get("content-type","").startswith(("audio/","application/octet-stream"))
            except Exception as e:result["error"]=str(e)[:180]
            print("AUDIO_PROBE",json.dumps(result),flush=True)
          PY