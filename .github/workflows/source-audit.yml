name: Audit first-party source and regression tests
on:
  push:
    branches: [privacy/toonami-single-stream-test, feature/ham-radio-live-sdr, perf/weatherstar-lite]
    paths:
      - .github/workflows/source-audit.yml
      - js/**
      - assets/*.css
      - assets/boot.js
      - assets/weatherstar-compat.js
      - tools/**
      - tests/**
      - docs/**
  workflow_dispatch:
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax, module headers and named function contracts
        run: node tools/check-source-docs.js
      - name: Verify channel switching, media isolation and weather location
        run: |
          node tests/core-contracts.test.js
          node tests/tv-epg-race.test.js
          node tests/epg-time.test.js
          node tests/radio-station-switch.test.js
          node tests/hamradio.test.js
          node tests/hamradio-sse.test.js
          node tests/tvguide-layout.test.js
          node tests/weatherstar-display.test.js
          node tests/weatherstar-lite.test.js
          node tests/weatherstar-polyfills.test.js
          node tests/radio-cover-shape.test.js
          node tests/weatherstar-nws-compat.test.js
          node tests/catchup-navigation-race.test.js
          node tests/player-audio-race.test.js
          node tests/radio-metadata-timeout.test.js
          node tests/settings-profile-race.test.js
          node tests/vod-series-race.test.js
          node tests/vod-subtitle-search-race.test.js
          node tests/weatherstar-location.test.js
